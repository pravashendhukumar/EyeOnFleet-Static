<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 600' width='1200' height='600'>
  <rect width='100%' height='100%' fill='rgba(230,251,239,0.95)'/>

  <!-- Left: app mockup -->
  <g transform='translate(40,40)'>
    <rect x='0' y='0' width='720' height='520' rx='10' fill='#ffffff' opacity='0.9' stroke='#dff6ea'/>
    <text x='24' y='32' font-family='Arial' font-size='18' fill='#0f5132'>Fleet Dashboard</text>
    <!-- mini map inside -->
    <rect x='24' y='56' width='420' height='240' rx='8' fill='#eaf9ef' stroke='#d4f0db'/>
    <g fill='#16a34a'>
      <circle cx='80' cy='120' r='8'/>
      <circle cx='180' cy='200' r='8'/>
      <circle cx='320' cy='160' r='8'/>
    </g>
    <rect x='460' y='56' width='200' height='240' rx='8' fill='#f8fff9' stroke='#e6f6ea'/>
    <text x='476' y='84' font-family='Arial' font-size='14' fill='#0f5132'>Summary</text>
    <rect x='476' y='100' width='160' height='12' rx='6' fill='#22c55e'/>
    <rect x='476' y='120' width='120' height='10' rx='5' fill='#dff6ea'/>
  </g>

  <!-- Right: charts -->
  <g transform='translate(780,60)'>
    <rect x='0' y='0' width='360' height='220' rx='10' fill='#ffffff' opacity='0.9' stroke='#dff6ea'/>
    <text x='18' y='26' font-family='Arial' font-size='14' fill='#0f5132'>Utilization</text>
    <rect x='18' y='44' width='320' height='12' rx='6' fill='#dff6ea'/>
    <rect x='18' y='66' width='260' height='10' rx='5' fill='#22c55e'/>

    <rect x='0' y='250' width='360' height='220' rx='10' fill='#ffffff' opacity='0.9' stroke='#dff6ea'/>
    <text x='18' y='282' font-family='Arial' font-size='14' fill='#0f5132'>Trip Distance (last 7 days)</text>
    <g transform='translate(18,300)'>
      <rect x='0' y='80' width='18' height='40' fill='#16a34a'/>
      <rect x='30' y='60' width='18' height='60' fill='#22c55e'/>
      <rect x='60' y='20' width='18' height='100' fill='#a7f3d0'/>
      <rect x='90' y='40' width='18' height='80' fill='#34d399'/>
    </g>
  </g>

</svg>