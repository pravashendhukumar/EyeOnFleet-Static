<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 800' width='1600' height='800'>
  <!-- soft green background transparent feel -->
  <rect width='100%' height='100%' fill='rgba(230,251,239,0.95)'/>

  <!-- map grid / organic shapes -->
  <g opacity='0.55'>
    <rect x='120' y='140' width='1060' height='480' rx='14' fill='#eaf9ef'/>
    <g fill='none' stroke='#d2f0dc' stroke-width='1'>
      <path d='M160 180 q200 -40 400 0 t400 0 t200 0' />
      <path d='M160 260 q200 -30 400 10 t400 20 t200 0' />
    </g>
  </g>

  <!-- vehicle markers -->
  <g transform='translate(260,220)'>
    <circle cx='0' cy='0' r='12' fill='#16a34a' stroke='#0f5132' stroke-width='2'/>
    <text x='20' y='6' font-family='Arial' font-size='14' fill='#0f5132'>Truck 324</text>
  </g>
  <g transform='translate(540,320)'>
    <circle cx='0' cy='0' r='10' fill='#22c55e' stroke='#0f5132' stroke-width='2'/>
    <text x='18' y='6' font-family='Arial' font-size='14' fill='#0f5132'>Bike 12</text>
  </g>
  <g transform='translate(840,260)'>
    <circle cx='0' cy='0' r='12' fill='#16a34a' stroke='#0f5132' stroke-width='2'/>
    <text x='20' y='6' font-family='Arial' font-size='14' fill='#0f5132'>Van 77</text>
  </g>

  <!-- mini dashboard inset -->
  <g transform='translate(1150,180)'>
    <rect x='0' y='0' width='340' height='200' rx='10' fill='rgba(255,255,255,0.85)' stroke='#d6f2db'/>
    <text x='18' y='34' font-family='Arial' font-size='16' fill='#0f5132'>Active Vehicles</text>
    <rect x='18' y='54' width='120' height='16' rx='8' fill='#22c55e'/>
    <rect x='18' y='80' width='240' height='10' rx='6' fill='#dff6ea'/>
    <circle cx='270' cy='70' r='26' fill='#f8fff9' stroke='#cdefdb'/>
    <text x='258' y='75' font-family='Arial' font-size='18' fill='#0f5132'>92</text>
  </g>

  <!-- heading text area left -->
  <g transform='translate(80,80)'>
    <text x='0' y='40' font-family='Arial' font-size='52' font-weight='700' fill='#0f172a'>Your Fleet, Our Eye</text>
    <text x='0' y='90' font-family='Arial' font-size='18' fill='#134e3a'>Next-generation GPS & IoT solutions for total visibility, safety, and efficiency.</text>
  </g>

</svg>